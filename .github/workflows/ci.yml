name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (static, all binaries)
        run: |
          mkdir -p builds
          for d in cmd/*/; do
            b=$(basename "$d")
            [ -f "$d/go.mod" ] && continue
            CGO_ENABLED=0 go build -ldflags "-s -w" -o "builds/$b" "./cmd/$b"
          done

      - name: DNS relay module (separate go.mod, Go 1.25)
        working-directory: cmd/dnshived-dnsrelay
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../../builds/dnshived-dnsrelay .
          go test -count=1 ./...

      # The tests write files the way a real install does, owned by the
      # dnshived group, which needs root and that group.
      - name: Create the dnshived service users
        run: |
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin dnshived
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin dnshived-relay
          sudo usermod -aG dnshived-relay dnshived

      - name: Test
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 ./...

      - name: Test with race detector (coordination and safety packages)
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -race -count=1 \
            ./internal/agent ./internal/arbiter ./internal/cluster ./internal/coordplane \
            ./internal/desired ./internal/fencing ./internal/fsm ./internal/leasesync \
            ./internal/nftgate ./internal/dhcprelay ./internal/state ./internal/tlspin \
            ./internal/bootstrap ./internal/quorum
